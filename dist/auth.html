<!DOCTYPE html>
<html>
  <head>
    <title>Login into the game</title>
    <link rel = "icon" type = "image/x-icon" href = "./bin/images/favicon.ico">
  </head>
  <body style = "width: 1920px; height: 1080px; background-image: url('bin/images/skybg.png'); background-repeat: no-repeat; background-size: 100% 100%">
    <div>
      <h1 style="color: rgb(0, 0, 0);
            width: 300px;
            height: 60px;
            font-size: 30px;
            position: absolute;
            top: 220px;
            left: 940px;   
            ">Login</h1>
      <form id = "login-form">
        <input style = "width: 250px;
                        height: 60px;
                        font-size: 30px;
                        position: absolute;
                        top: 300px;
                        left: 850px;" type = "text" id = "username-input" placeholder = "nickname" required />
        <button style = "width: 250px;
                         height: 60px;
                         font-size: 30px;
                         position: absolute;
                         top: 400px;
                         left: 850px;" type = "submit">Login</button>
      </form>
      <div id = "error-text"></div>
    </div>
    <script>
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username-input").value;
        const errorPane = document.getElementById("error-text");
        try {
          const response = await fetch("/auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username }),
          });
          const data = await response.json();
          if (data.success) {
            localStorage.setItem("username", username);
            window.location.href = "/game";
          } else { errorPane.textContent = data.error; }
        } catch (error) {
            errorPane.textContent = "Connection error";
        }
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Login | Scorched Earth 3D</title>
  <link rel = "icon" type = "image/x-icon" href = "./bin/images/favicon.ico">
  <link href = "https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel = "stylesheet">
  <link rel = "stylesheet" href = "style.css">
</head>
<body class = "futuristic-bg" style = "background-image: url('./bin/images/skybg.png')">
  <div class = "container">
    <div class = "corner-decoration top-left"></div>
    <div class = "corner-decoration top-right"></div>
    <div class = "corner-decoration bottom-left"></div>
    <div class = "corner-decoration bottom-right"></div>
    
    <h1 class = "title">Login</h1>
    <form id = "login-form">
      <div class = "input-group">
        <input class = "input-field" type = "text" id = "username-input" placeholder = "Enter your nickname" required>
      </div>
      <button class = "btn" type = "submit">Commit to be</button>
      <div id="error-text"></div>
    </form>
  </div>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username-input").value;
        const errorPane = document.getElementById("error-text");
        try {
            const response = await fetch("/auth", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username }),
            });
            const data = await response.json();
            if (data.success) {
                localStorage.setItem("username", username);
                window.location.href = "/game";
            } else { errorPane.textContent = data.error; }
        } catch (error) {
            errorPane.textContent = "Connection error";
        }
    });
  </script>
</body>
</html>

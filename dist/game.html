<!DOCTYPE html>
<html>
<head>
  <title>Scorched Earth</title>
  <link rel = "icon" type = "image/x-icon" href = "./bin/images/favicon.ico">
  <link href = "https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel = "stylesheet">
  <link rel = "stylesheet" href = "style.css">
</head>
<body>
  <!-- Loading Screen -->
  <div id = "loading-screen" style = "background-image: url('./bin/images/skybg.png')">
    <div class = "loading-container">
      <div class = "loading-corner top-left"></div>
      <div class = "loading-corner top-right"></div>
      <div class = "loading-corner bottom-left"></div>
      <div class = "loading-corner bottom-right"></div>
      
      <h1 class = "loading-title">SCORCHED EARTH 3D</h1>
      <p class = "loading-text">Starting up...</p>
      <div class = "loading-bar-container">
        <div class = "loading-bar" id = "loading-bar"></div>
      </div>
      <div class = "loading-dots">
        <div class = "loading-dot"></div>
        <div class = "loading-dot"></div>
        <div class = "loading-dot"></div>
      </div>
    </div>
  </div>
  <!-- Game Screen -->
  <div>
    <div id = "top-info">
      <h1 id = "chat-text" style = "color: black;">Loading...</h1>
      <div id = "account-info">
        <span id = "account-name"></span>
      </div>
    </div>
  </div>
  <canvas
    id="webgl-canvas" width="1920px" height="1080px"
    style="border: none; position: fixed; left: 0; top: 0; width: 100%; height:100%;"
  ></canvas>
  <script src = "../socket.io/socket.io.js"></script>
  <script type = "text/javascript" src = "./bundle.js"></script>
  
  <script>
    let progress = 0;
    const loadingBar = document.getElementById('loading-bar');
    const loadingScreen = document.getElementById('loading-screen');
    const loadingText = document.querySelector('.loading-text');
    
    const loadingMessages = [
      "Creating shaders...",
      "Initializing textures...",
      "Loading terrain...",
      "Syncing multiplayer...",
      "Almost there..."
    ];
    
    const interval = setInterval(() => {
      progress += Math.random() * 10;
      if (progress > 100) progress = 100;
      loadingBar.style.width = `${progress}%`;
      
      if (progress % 25 < 5) {
        loadingText.textContent = loadingMessages[Math.floor(progress / 25)];
      }
      
      if (progress >= 100) {
        clearInterval(interval);
        setTimeout(() => {
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500);
        }, 500);
      }
    }, 300);
  </script>
</body>
</html>
